<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>低点/高点标注器 · SPX</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --line:#262d38; --line2:#1e242e;
  --ink:#e6edf7; --ink2:#9aa7b8; --ink3:#6b7685;
  --brand:#7c8cf8; --up:#2fd39b; --down:#f85149;
  --low:#2fd39b; --high:#f0883e; --sel:rgba(124,140,248,.18);
  color-scheme: dark;
}
html[data-theme="light"]{
  --bg:#f9fafb; --panel:#ffffff; --line:#e5e7eb; --line2:#f1f3f5;
  --ink:#111827; --ink2:#4b5563; --ink3:#9ca3af;
  --brand:#4f5fd4; --up:#059669; --down:#dc2626;
  --low:#059669; --high:#b45309; --sel:rgba(79,95,212,.14);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--brand)}
button.on{background:var(--brand);border-color:var(--brand);color:#fff}
select,input[type=text]{background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:4px 8px}

#top{height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;
  border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:nowrap;overflow-x:auto}
#top .sep{width:1px;height:20px;background:var(--line);margin:0 2px;flex:none}
#top .grow{flex:1}
.lbl{color:var(--ink3);font-size:12px;flex:none}
#status{font-size:12px;color:var(--ink2);white-space:nowrap}
#status.dirty{color:var(--high);font-weight:600}

#main{position:absolute;top:44px;bottom:0;left:0;right:320px}
#side{position:absolute;top:44px;bottom:0;right:0;width:320px;
  border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
#chart{position:absolute;inset:0;cursor:crosshair}
#chart canvas{position:absolute;inset:0;width:100%;height:100%}
#hint{position:absolute;left:10px;top:8px;font-size:11px;color:var(--ink3);
  pointer-events:none;background:var(--panel);padding:3px 8px;border-radius:5px;opacity:.85}
#readout{position:absolute;right:72px;top:8px;font-size:12px;color:var(--ink2);
  pointer-events:none;background:var(--panel);padding:4px 9px;border-radius:5px;
  border:1px solid var(--line);white-space:pre;font-variant-numeric:tabular-nums}

#sidehead{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:8px;flex-wrap:wrap}
#list{flex:1;overflow-y:auto}
.row{padding:7px 12px;border-bottom:1px solid var(--line2);display:flex;
  align-items:center;gap:7px;cursor:pointer}
.row:hover{background:var(--line2)}
.row.cur{background:var(--sel)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.row .d{font-variant-numeric:tabular-nums;white-space:nowrap}
.row .p{color:var(--ink2);font-size:12px;font-variant-numeric:tabular-nums;
  margin-left:auto;white-space:nowrap}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);
  color:var(--ink2);flex:none}
.tag.strong{background:var(--brand);border-color:var(--brand);color:#fff}
.del{color:var(--ink3);flex:none;padding:0 3px}
.del:hover{color:var(--down)}
#sidefoot{padding:8px 12px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink2)}
body.ro #status{color:var(--high)}
#sel-info{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#note{width:100%;margin-top:4px}
</style>
</head>
<body>

<div id="top">
  <b style="flex:none">SPX 标注器</b>
  <span class="sep"></span>
  <span class="lbl">标注类型</span>
  <button id="m-low" class="on">低点</button>
  <button id="m-high">高点</button>
  <span class="sep"></span>
  <span class="lbl">框选后默认</span>
  <button id="s-strong" class="on">强</button>
  <button id="s-weak">弱</button>
  <span class="sep"></span>
  <span class="lbl">区间</span>
  <button data-win="1y">1年</button>
  <button data-win="3y">3年</button>
  <button data-win="5y">5年</button>
  <button data-win="10y">10年</button>
  <button data-win="all">全部</button>
  <span class="sep"></span>
  <button id="logbtn">对数轴</button>
  <button id="theme">亮/暗</button>
  <span class="grow"></span>
  <span id="status">载入中…</span>
  <button id="save">保存到 data/marks.json</button>
</div>

<div id="main">
  <div id="chart">
    <canvas id="base"></canvas>
    <canvas id="over"></canvas>
    <div id="readout"></div>
    <div id="hint">左键拖=框选取极值 · 滚轮=缩放 · 右键/Shift+左键拖=平移 · 双击=复位 · Ctrl+Z=撤销</div>
  </div>
</div>

<div id="side">
  <div id="sidehead">
    <b>标注列表</b>
    <span id="count" class="lbl"></span>
    <span class="grow" style="flex:1"></span>
    <select id="filter">
      <option value="all">全部</option>
      <option value="low">只看低点</option>
      <option value="high">只看高点</option>
    </select>
  </div>
  <div id="list"></div>
  <div id="sidefoot">
    <span id="sel-info">未选中</span>
    <input type="text" id="note" placeholder="给选中的标注写备注，回车保存到内存">
  </div>
</div>

<script src="spx.js?v=202609180744"></script>
<script src="marks.js?v=202609180744"></script>
<script src="marker.js?v=202609180744"></script>
</body>
</html>
